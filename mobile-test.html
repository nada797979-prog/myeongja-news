<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>mobile check</title>
<style>html,body{margin:0;padding:0;background:#fff}iframe{display:block;width:390px;height:844px;border:0}</style>
</head><body>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var s = q.get("s");
var y = Number(q.get("y") || 0);
var f = document.getElementById("f");
f.src = "./index.html?t=" + Date.now();
if (y) {
  f.addEventListener("load", function () { f.contentWindow.scrollTo(0, y); });
}
if (s === "news") {
  f.addEventListener("load", function () {
    var w = f.contentWindow, d = f.contentDocument;
    var el = d.getElementById("newsPanel");
    if (el) w.scrollTo(0, el.offsetTop - 265);
  });
}
if (s === "rhino") {
  f.addEventListener("load", function () {
    var w = f.contentWindow, d = f.contentDocument;
    var el = d.getElementById("newsPanel");
    if (el) w.scrollTo(0, el.offsetTop - 40);
  });
}
</script>
</body></html>
