<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>proxy debug3</title></head>
<body>
<pre id="out">running…</pre>
<script>
var FEED = "https://www.yna.co.kr/rss/society.xml";
var lines = [];
function log(s) { lines.push(s); document.getElementById("out").textContent = lines.join("\n"); }
function probe(label, url) {
  var t0 = Date.now();
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 8000);
  return fetch(url, { cache: "no-store", signal: ctrl.signal }).then(function (r) {
    return r.text().then(function (t) {
      clearTimeout(timer);
      var first = (t.match(/<pubDate>([^<]+)<\/pubDate>/) || [])[1] ||
                  (t.match(/"pubDate":\s*"([^"]+)"/) || [])[1] || "?";
      log(label + " http=" + r.status + " ms=" + (Date.now() - t0) + " bytes=" + t.length + " first=" + first);
    });
  }).catch(function (e) { clearTimeout(timer); log(label + " ERR " + String(e).slice(0, 60) + " ms=" + (Date.now() - t0)); });
}
var stamp = Date.now();
var bust = FEED + "?sb=" + stamp;
var enc = encodeURIComponent(bust);
var raw = encodeURIComponent(FEED);
var jobs = [
  probe("cors.eu.org", "https://cors.eu.org/" + bust),
  probe("cors.workers.dev", "https://test.cors.workers.dev/?" + bust),
  probe("corsfix", "https://proxy.corsfix.com/?" + bust),
  probe("feed2json", "https://feed2json.org/convert?url=" + enc),
  probe("whateverorigin", "https://www.whateverorigin.org/get?url=" + enc),
  probe("rss2json-a", "https://api.rss2json.com/v1/api.json?rss_url=" + enc + "&count=50"),
  probe("rss2json-b", "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(FEED) + "&count=50&_=" + stamp),
  probe("jina-raw", "https://r.jina.ai/" + bust + "?x-respond-with=text")
];
Promise.all(jobs).then(function () { log("done"); });
</script>
</body></html>
