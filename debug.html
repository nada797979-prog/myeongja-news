<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>news debug</title></head>
<body>
<pre id="out">running…</pre>
<script>
var FEEDS = {
  yna_society: "https://www.yna.co.kr/rss/society.xml",
  sbs_society: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=03&plink=RSSREADER",
  donga_society: "https://rss.donga.com/national.xml",
  hani_society: "https://www.hani.co.kr/rss/society",
  yna_all: "https://www.yna.co.kr/rss/news.xml",
  mt_all: "https://rss.mt.co.kr/mt_news.xml"
};
var lines = [];
function log(s) { lines.push(s); document.getElementById("out").textContent = lines.join("\n"); }

log("now=" + new Date().toISOString());
log("sw=" + (navigator.serviceWorker && navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : "none"));

try {
  var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf("mj_feed") === 0; });
  log("cache keys: " + keys.length);
  keys.forEach(function (k) {
    var v = null; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) {}
    var newest = 0, dated = 0;
    (v && v.items || []).forEach(function (it) { if (it.date) { dated++; if (it.date > newest) newest = it.date; } });
    log("  " + k + " ts=" + (v && v.ts ? new Date(v.ts).toISOString() : "-") +
        " n=" + ((v && v.items) || []).length + " dated=" + dated +
        " newest=" + (newest ? new Date(newest).toISOString() : "none"));
  });
} catch (e) { log("cache read err " + e); }

var names = Object.keys(FEEDS);
function run(i) {
  if (i >= names.length) { log("done"); return; }
  var name = names[i];
  var url = FEEDS[name];
  var stamp = String(Date.now());
  var bust = url + (url.indexOf("?") >= 0 ? "&" : "?") + "sb=" + stamp;
  var api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(bust) + "&count=50&_=" + stamp;
  var t0 = Date.now();
  fetch(api, { cache: "no-store" }).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (e) {}
      var first = d && d.items && d.items[0] ? (d.items[0].pubDate || "no-date") : "none";
      var dated = d && d.items ? d.items.filter(function (x) { return !!x.pubDate; }).length : 0;
      var withImg = d && d.items ? d.items.filter(function (x) { return x.enclosure && x.enclosure.link; }).length : 0;
      log(name + " http=" + r.status + " ms=" + (Date.now() - t0) + " status=" + (d && d.status) + " items=" + (d && d.items ? d.items.length : 0) + " dated=" + dated + " img=" + withImg + " first=" + first);
      if (d && d.status !== "ok") log("   msg=" + JSON.stringify(d).slice(0, 160));
      run(i + 1);
    });
  }).catch(function (e) { log(name + " ERR " + e + " ms=" + (Date.now() - t0)); run(i + 1); });
}
run(0);
</script>
</body></html>
