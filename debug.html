<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>proxy debug2</title></head>
<body>
<pre id="out">running…</pre>
<script>
var FEED = "https://www.yna.co.kr/rss/society.xml";
var lines = [];
function log(s) { lines.push(s); document.getElementById("out").textContent = lines.join("\n"); }
function probe(label, url) {
  var t0 = Date.now();
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 9000);
  return fetch(url, { cache: "no-store", signal: ctrl.signal }).then(function (r) {
    return r.text().then(function (t) {
      clearTimeout(timer);
      var first = (t.match(/<pubDate>([^<]+)<\/pubDate>/) || [])[1] ||
                  (t.match(/"pubDate":\s*"([^"]+)"/) || [])[1] || "?";
      log(label + " http=" + r.status + " ms=" + (Date.now() - t0) + " bytes=" + t.length + " first=" + first);
    });
  }).catch(function (e) { clearTimeout(timer); log(label + " ERR " + String(e).slice(0, 80) + " ms=" + (Date.now() - t0)); });
}
var stamp = Date.now();
var bust = FEED + "?sb=" + stamp;
var enc = encodeURIComponent(bust);
var jobs = [
  probe("direct", bust + "&x=1"),
  probe("codetabs", "https://api.codetabs.com/v1/proxy?quest=" + enc),
  probe("cors.lol", "https://api.cors.lol/?url=" + enc),
  probe("corsproxy.io", "https://corsproxy.io/?url=" + enc),
  probe("jina", "https://r.jina.ai/" + bust),
  probe("allorigins-get", "https://api.allorigins.win/get?url=" + enc),
  probe("rss2json", "https://api.rss2json.com/v1/api.json?rss_url=" + enc)
];
function checkAll() {
  if (lines.length >= jobs.length) { log("done"); } else { setTimeout(checkAll, 500); }
}
Promise.all(jobs).then(function () { log("done"); });
</script>
</body></html>
